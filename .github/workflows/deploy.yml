name: Test, Build and Deploy Save Shop Frontend to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Tests, Build & Deploy Web Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Test Suite
        run: npm test

      - name: Build Static Web App
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://chamber-golf-guardian-thumbnails.trycloudflare.com' }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 898498745806-g40fimuhq99o7aohltn4qqinpvog31d5.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 898498745806-gnrm36ifk3qoek9et2ej5o6ajrrc1bbm.apps.googleusercontent.com
        run: npx expo export --platform web

      - name: Deploy Built Assets to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: "/var/www/save-shop-frontend/dist"
          strip_components: 1
          rm: true
